name: Release CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-gnome:
    uses: ./.github/workflows/gnome-ci.yml

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo 'Release tag must match Cargo.toml version.' >&2
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Debian 12 GTK environment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: open-meteo-ci:latest
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application
      - name: Test and build verified packages
        run: sh scripts/ci.sh release
      - name: Retain packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64-release
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain build UI screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-evidence
          path: target/ci/
          if-no-files-found: warn
          retention-days: 14

  verify-packages:
    name: Verify packages (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [debian, kali, fedora, arch, appimage]
    steps:
      - name: Check out installation tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download packages and checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64-release
          path: dist/release
      - name: Install packages and verify the native interface
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          mkdir -p target/package-installation
          sh scripts/check-package-installation.sh "$PACKAGE_TARGET" dist/release 2>&1 \
            | tee "target/package-installation/$PACKAGE_TARGET.log"
      - name: Retain installation logs and UI captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-verification-${{ matrix.target }}
          path: target/package-installation/
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify-packages, verify-gnome]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out checksum verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64-release
          path: dist/release
      - name: Verify exact release inventory and checksums
        run: python3 scripts/verify-packages.py --checksums-only dist/release
      - name: Publish the versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/release/* \
            --verify-tag --generate-notes --title "Open Meteo ${RELEASE_TAG#v}"
